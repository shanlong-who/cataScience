url: https://shanlong-who.github.io/cataScience/
# The page keeps man/figures/logo.png; browser icons are independent.
# Regenerate pkgdown/favicon/ with pkgdown/build-favicons.R.
template:
  bootstrap: 5
  bslib:
    primary: '#0093D5'
    base_font:
      google: Source Sans Pro
    heading_font:
      google: Source Sans Pro
    code_font:
      google: JetBrains Mono
home:
  title: cataScience — A Journey of Data Science
  description: >
    An interactive R Shiny training companion for importing, cleaning,
    visualizing and understanding data, with guided AI exercises and a quiz.
navbar:
  structure:
    left: [app, intro, reference, articles, news]
    right: [search, github]
  components:
    app:
      text: Open app
      href: https://shanlong-who.github.io/cata/
reference:
  - title: Launch the training app
    desc: Open the bundled training app in a local R session.
    contents: [run_cata, run_catas]
  - title: Review and prepare data
    contents: [cata_read, cata_profile, cata_missing, cata_check_keys, cata_flag_outliers, cata_join]
  - title: Examples and denominators
    contents: [cata_example, cata_proportion, cata_count_status, cata_lao_analysis, cata_mice_demo]
  - title: Visualise and communicate
    contents: [cata_plot, theme_cata, cata_report, cata_export]
articles:
  - title: Learn with cataScience
    navbar: ~
    contents:
      - cataScience
      - data-quality-workflow
      - training-guide
authors:
  Shanlong Ding:
    href: https://github.com/shanlong-who
