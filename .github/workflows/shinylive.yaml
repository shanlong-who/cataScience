name: Build Shinylive apps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::shinylive, any::fs, any::jsonlite, local::.
          needs: website
      - name: Build workshop and classic browser apps
        run: Rscript pkgdown/build-shinylive.R outputs/shinylive
      - uses: actions/upload-artifact@v4
        with:
          name: cataScience-shinylive
          path: outputs/shinylive/site
          include-hidden-files: true
          if-no-files-found: error
