  components:
    app:
      text: 打开应用
      href: https://shanlong-who.github.io/cata/?lang=zh
    intro:
      text: 入门
      href: articles/cataScience.html
    reference:
      text: 函数参考
      href: reference/index.html
    articles:
      text: 使用指南
      menu:
        - text: 快速入门
          href: articles/cataScience.html
        - text: 数据质量工作流
          href: articles/data-quality-workflow.html
        - text: 培训指南
          href: articles/training-guide.html
    news:
      text: 更新记录
      href: news/index.html
    language:
      text: English
      href: https://shanlong-who.github.io/cataScience/
reference:
  - title: 启动培训应用
    desc: 在本地 R 会话中打开经典版或扩展培训版。
    contents: [run_cata, run_catas]
  - title: 检查和整理数据
    contents: [cata_read, cata_profile, cata_missing, cata_check_keys, cata_flag_outliers, cata_join]
  - title: 示例、分母与统计分析
    contents: [cata_example, cata_proportion, cata_count_status, cata_lao_analysis, cata_mice_demo]
  - title: 可视化与结果沟通
    contents: [cata_plot, theme_cata, cata_report, cata_export]
